[package]
name = "readsynth"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "readsynth"
path = "src/main.rs"

[lib]
name = "readsynth"
path = "src/lib.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
indicatif = "0.17"
csv      = "1"
flate2   = "1"
indexmap = { version = "2", features = ["serde"] }
rand     = "0.8"
rayon    = "1"
regex    = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# nothing extra — std test framework + lib pub API is sufficient
